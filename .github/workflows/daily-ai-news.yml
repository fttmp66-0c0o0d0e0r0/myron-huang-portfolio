name: Daily AI News Auto-Update

on:
  schedule:
    # 00:00 UTC = 08:00 Taiwan Standard Time (UTC+8)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI News Updater
        run: |
          python scripts/update_ai_news.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "[automated] daily AI news update (08:00 TST)" && git push origin main)
